<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小呆走跑銜接比較</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #242424; color: #eee; margin: 2rem auto; max-width: 850px; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    section { background: #363636; border-radius: 12px; padding: 1rem; }
    canvas { width: 100%; height: auto; display: block; }
    button { padding: .6rem 1rem; font: inherit; cursor: pointer; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <h1>走跑銜接比較</h1>
  <p>左邊直接由走路落腳切到跑步落地；右邊插入兩張試作姿勢。兩邊都使用 68 毫秒淡化，方便觀察身體、腳掌及尾巴的落差。此頁是測試用預覽，並非桌面寵物實際步態與速度。</p>
  <button id="toggle">暫停</button>
  <div class="grid">
    <section><h2>目前切換</h2><canvas id="before" width="384" height="406"></canvas></section>
    <section><h2>加入候選姿勢</h2><canvas id="after" width="384" height="406"></canvas></section>
  </div>
  <p id="status">正在載入圖片…</p>
  <script src="../../src/core/crossfade.js"></script>
  <script>
    const paths = [
      '../../assets/pets/小呆/generated/motions/walk-cycle-v1/frames/frame-020-opposite-contact.webp',
      './01-raised.webp', './02-lowering.webp',
      '../../assets/pets/小呆/generated/motions/run-cycle-v1/frames/frame-010-front-landing.webp',
    ];
    const load = src => new Promise((resolve, reject) => {
      const image = new Image(); image.onload = () => resolve(image); image.onerror = () => reject(new Error(src)); image.src = src;
    });
    Promise.all(paths.map(load)).then(images => {
      const canvases = [document.querySelector('#before'), document.querySelector('#after')];
      const tracks = [ [{at: 0, image: 0}, {at: 800, image: 3}],
        [{at: 0, image: 0}, {at: 800, image: 1}, {at: 940, image: 2}, {at: 1080, image: 3}] ];
      let running = true, last = performance.now(), elapsed = 0;
      document.querySelector('#status').textContent = '循環預覽：走路落腳 → 跑步落地';
      document.querySelector('#toggle').onclick = event => { running = !running; event.target.textContent = running ? '暫停' : '播放'; };
      function draw(canvas, track, time) {
        const ctx = canvas.getContext('2d');
        const index = track.findLastIndex(frame => time >= frame.at);
        const current = track[index], previous = track[index - 1];
        const blend = Math.min(1, Math.max(0, (time - current.at) / 68));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const layer = (image, alpha) => { ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(images[image], 0, 0, canvas.width, canvas.height); ctx.restore(); };
        XiaodaiCrossfade.drawCrossfade(ctx, previous ? alpha => layer(previous.image, alpha) : null, alpha => layer(current.image, alpha), blend);
      }
      function tick(now) {
        if (running) elapsed += now - last;
        last = now;
        for (let i = 0; i < canvases.length; i++) draw(canvases[i], tracks[i], elapsed % 2200);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }).catch(error => { document.querySelector('#status').textContent = `圖片載入失敗：${error.message}`; });
  </script>
</body>
</html>
